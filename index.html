<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學物理坦克大戰 - 五國語言版</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        /* 語言切換列 */
        #lang-bar {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            gap: 6px;
            z-index: 30;
        }
        .lang-btn {
            padding: 5px 10px;
            font-size: 13px;
            background: #34495e;
            color: #f1c40f;
            border: 2px solid #f1c40f;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .lang-btn:hover { background: #f1c40f; color: #1a1a1a; }

        /* 模式選擇大廳畫面 */
        #lobby, #celebration-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 26, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 20px;
        }
        #celebration-screen { display: none; z-index: 20; background: rgba(15, 15, 15, 0.95); }
        
        h1 { color: #f1c40f; margin-bottom: 5px; text-align: center; font-size: 34px; }
        .designer-tag {
            color: #3498db;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .mode-btn {
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 340px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .mode-btn:hover { background: #219653; }
        
        /* 頂部 UI 介面 */
        #ui {
            margin-bottom: 8px;
            display: flex;
            gap: 12px;
            font-size: 15px;
            font-weight: bold;
            align-items: center;
            background: #2c3e50;
            padding: 10px 18px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            justify-content: center;
        }
        .control-group { display: flex; gap: 6px; align-items: center; }
        button {
            padding: 6px 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        button:hover { background: #c0392b; }
        canvas {
            border: 4px solid #34495e;
            background: linear-gradient(to bottom, #4a90e2, #e0f6ff);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            max-width: 100%;
            height: auto;
        }
        #math-panel {
            margin-top: 8px;
            background: #34495e;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            color: #f1c40f;
            text-align: center;
            max-width: 820px;
            font-weight: bold;
        }

        /* 換手過場遮罩 */
        #pass-mask {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            font-size: 26px;
            color: #f1c40f;
            gap: 20px;
        }

        .trophy-card {
            background: #2c3e50;
            border: 3px solid #f1c40f;
            padding: 35px 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.5);
            max-width: 650px;
        }
    </style>
</head>
<body>

    <!-- 🌍 語言切換列 -->
    <div id="lang-bar">
        <button class="lang-btn" onclick="setLanguage('zh-TW')">繁中</button>
        <button class="lang-btn" onclick="setLanguage('zh-CN')">简体</button>

    <div id="lobby">
        <h1 id="i18n-title">🎯 數學物理坦克大戰</h1>
        <div class="designer-tag">國立高雄師範大學 劉世閔博士 總設計</div>
        <p id="i18n-select-mode" style="color: #ddd; margin-bottom: 15px; font-size: 18px;">請選擇您的遊玩模式：</p>
        <button class="mode-btn" onclick="startMode('self')" id="i18n-mode-1">👤 1. 單人左右互搏 (自我訓練)</button>
        <button class="mode-btn" onclick="startMode('hotseat')" id="i18n-mode-2">👥 2. 二人一機對戰 (同機過場)</button>
    </div>

    <!-- 🏆 總冠軍頒獎典禮畫面 -->

        <div class="trophy-card">
            <div style="font-size: 70px; margin-bottom: 10px;">🏆</div>
            <h1 id="champion-title" style="color: #ff5252; font-size: 36px;">紅隊 榮獲總冠軍！</h1>
            <div class="designer-tag" style="margin: 10px 0; font-size: 16px;">國立高雄師範大學 劉世閔博士 總設計</div>
            <p style="color: #ecf0f1; font-size: 17px; margin: 20px 0;" id="champion-stats">經過五戰三勝激戰，展現了卓越的數學與物理計算能力！</p>
            <button class="mode-btn" onclick="returnToLobby()" id="i18n-restart" style="margin-top: 15px; width: 220px;">🔄 再次挑戰</button>
        </div>
    </div>

    <!-- 二人一機過場遮罩 -->
    <div id="pass-mask">
        <div id="pass-text">請把電腦交給下一位玩家！</div>
        <button class="mode-btn" onclick="dismissMask()" id="i18n-ready" style="width: 220px;">準備好了！</button>
    </div>

    <div id="ui">
        <div><span id="i18n-level">局數</span>: <span id="levelText" style="color: #f1c40f; font-weight: bold;">1</span>/5</div>
        <div><span id="i18n-turn">回合</span>: <span id="turnText" style="color: #ff5252; font-weight: bold;">紅隊</span></div>
        <div><span id="i18n-wind">風速</span>: <span id="windText" style="color: #00e676;">0</span></div>
        <div><span id="i18n-trial">試瞄</span>: <span id="trialText" style="color: #00e676; font-weight: bold;">4</span></div>
        <div><span id="i18n-shield">防護罩</span>: <span id="shieldText" style="color: #00e5ff; font-weight: bold;">0</span></div>
        <div class="control-group">
            <span><span id="i18n-angle">仰角</span>: <span id="angleText">45</span>°</span>
            <button onclick="adjustAngle(-5)">➖</button>
            <button onclick="adjustAngle(5)">➕</button>
        </div>
        <div class="control-group">
            <span><span id="i18n-power">力度</span>: <span id="powerText">50</span></span>
            <button onclick="adjustPower(-5)">➖</button>
            <button onclick="adjustPower(5)">➕</button>
        </div>
        <button onclick="fireCannon()" id="fireBtn" style="background: #27ae60;">🔥 發射</button>
    </div>

    <canvas id="gameCanvas" width="800" height="420"></canvas>

    <div id="math-panel" id="i18n-tip">

            }

        function setLanguage(lang) {
            currentLang = lang;
            const t = langData[lang];
            
            document.getElementById('i18n-title').innerText = t.title;
            document.getElementById('i18n-select-mode').innerText = t.selectMode;
            document.getElementById('i18n-mode-1').innerText = t.mode1;
            document.getElementById('i18n-mode-2').innerText = t.mode2;
            document.getElementById('i18n-level').innerText = t.level;
            document.getElementById('i18n-turn').innerText = t.turn;
            document.getElementById('i18n-wind').innerText = t.wind;
            document.getElementById('i18n-trial').innerText = t.trial;
            document.getElementById('i18n-shield').innerText = t.shield;
            document.getElementById('i18n-angle').innerText = t.angle;
            document.getElementById('i18n-power').innerText = t.power;
            document.getElementById('fireBtn').innerText = t.fire;
            document.getElementById('math-panel').innerText = t.tip;
            document.getElementById('pass-text').innerText = t.passText;
            document.getElementById('i18n-ready').innerText = t.readyBtn;
            document.getElementById('i18n-restart').innerText = t.restart;
            updateUI();
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameMode = ''; 

        function startMode(mode) {
            gameMode = mode;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('celebration-screen').style.display = 'none';
            initGameLoop();
        }

        function returnToLobby() {
            document.getElementById('celebration-screen').style.display = 'none';
            document.getElementById('lobby').style.display = 'flex';
        }

        let currentLevel = 1; 
        let turn = 'red'; 
        let terrainHeights = [];
        let windPower = 0; 

        let redMatchWins = 0, blueMatchWins = 0;
        let redScore = 0, blueScore = 0;
        let redDestroyed = 0, blueDestroyed = 0;

        let redTank = { x: 100, y: 320, angle: 45, power: 50 };
        let blueTank = { x: 700, y: 320, angle: 135, power: 50 };

        let redTrialsLeft = 4;
        let blueTrialsLeft = 4;
        let redShields = 0, blueShields = 0;

        let bulletMaxHeight = 0, launchBaseY = 320;
        let bullet = null;

        function fnUpdateWindAndTerrain() {
            windPower = (Math.random() - 0.5) * (currentLevel * 0.18);
            let windDesc = windPower === 0 ? "0.0" : (windPower > 0 ? `+${(windPower*10).toFixed(1)}` : `${(windPower*10).toFixed(1)}`);
            document.getElementById('windText').innerText = windDesc;
        }

        function generateTerrain() {
            terrainHeights = [];
            for (let x = 0; x <= canvas.width; x += 10) {
                let y = 320 + Math.sin(x * 0.015) * 45 + Math.cos(x * 0.008) * 30;
                terrainHeights.push({ x: x, y: Math.min(380, Math.max(150, y)) });
            }
        }

        function getTerrainY(x) {
            for (let i = 0; i < terrainHeights.length - 1; i++) {
                if (x >= terrainHeights[i].x && x <= terrainHeights[i+1].x) {
                    let t = (x - terrainHeights[i].x) / (terrainHeights[i+1].x - terrainHeights[i].x);
                    return terrainHeights[i].y * (1 - t) + terrainHeights[i+1].y * t;
                }
            }
            return 320;
        }

        function destroyTerrain(hitX, radius) {
            terrainHeights.forEach(p => {
                let dist = Math.abs(p.x - hitX);
                if (dist < radius) {
                    let depth = Math.sqrt(radius * radius - dist * dist) * 0.6;
                    p.y = Math.min(400, p.y + depth);
                }
            });
        }

        function initLevel(level) {
            currentLevel = level;
            redDestroyed = 0; blueDestroyed = 0;
            let initialTrials = Math.max(0, 5 - level);
            redTrialsLeft = initialTrials;
            blueTrialsLeft = initialTrials;

            redShields = level >= 5 ? 2 : (level >= 4 ? 1 : 0);
            blueShields = level >= 5 ? 2 : (level >= 4 ? 1 : 0);

            document.getElementById('levelText').innerText = currentLevel;
            updateTrialUI();
            generateTerrain();
            spawnNewTanks();
        }

        function spawnNewTanks() {
            redTank.x = 60 + Math.random() * 180;
            blueTank.x = 560 + Math.random() * 180;
            redTank.y = getTerrainY(redTank.x) - 15;
            blueTank.y = getTerrainY(blueTank.x) - 15;
            redTank.angle = 45; blueTank.angle = 135;
            fnUpdateWindAndTerrain();
            updateUI();
        }

        function initGameLoop() {
            redMatchWins = 0; blueMatchWins = 0; redScore = 0; blueScore = 0;
            initLevel(1);
            loop();
        }

        function adjustAngle(amount) {
            if (turn === 'red') {
                redTank.angle = Math.max(0, Math.min(90, redTank.angle + amount));
                document.getElementById('angleText').innerText = redTank.angle;
            } else {
                blueTank.angle = Math.max(90, Math.min(180, blueTank.angle + amount));
                document.getElementById('angleText').innerText = 180 - blueTank.angle;
            }
        }

        function adjustPower(amount) {
            if (turn === 'red') {
                redTank.power = Math.max(10, Math.min(100, redTank.power + amount));
                document.getElementById('powerText').innerText = redTank.power;
            } else {
                blueTank.power = Math.max(10, Math.min(100, blueTank.power + amount));
                document.getElementById('powerText').innerText = blueTank.power;
            }
        }

        function fireCannon() {
            if (bullet) return;

            if (turn === 'red' && redTrialsLeft > 0) redTrialsLeft--;
            else if (turn === 'blue' && blueTrialsLeft > 0) blueTrialsLeft--;
            updateTrialUI();

            let tank = turn === 'red' ? redTank : blueTank;
            let rad = (tank.angle * Math.PI) / 180;
            let speed = tank.power * 0.25;
            launchBaseY = tank.y;
            bulletMaxHeight = tank.y;

            bullet = {
                x: tank.x + Math.cos(rad) * 25,
                y: tank.y - Math.sin(rad) * 25,
                vx: Math.cos(rad) * speed,
                vy: -Math.sin(rad) * speed,
                age: 0
            };
        }

        function update() {
            if (bullet) {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                bullet.vy += 0.22; 
                bullet.vx += windPower; 
                bullet.age++;

                if (bullet.y < bulletMaxHeight) bulletMaxHeight = bullet.y;

                if (bullet.x <= 0) { bullet.x = 0; bullet.vx = -bullet.vx * 0.75; }
                else if (bullet.x >= canvas.width) { bullet.x = canvas.width; bullet.vx = -bullet.vx * 0.75; }

                let groundY = getTerrainY(bullet.x);
                let activeTank = turn === 'red' ? redTank : blueTank;
                const t = langData[currentLang];
                
                if (bullet.age > 12 && Math.hypot(bullet.x - activeTank.x, bullet.y - activeTank.y) < 22) {
                    bullet = null;
                    let currentShields = turn === 'red' ? redShields : blueShields;
                    if (currentShields > 0) {
                        if (turn === 'red') redShields--; else blueShields--;
                        alert(`🛡️ [${turn === 'red' ? t.redTeam : t.blueTeam}] ${t.shieldBlock}`);
                        updateTrialUI();
                        endTurnSequence();
                        return;
                    }
                    if (turn === 'red') redDestroyed++; else blueDestroyed++;
                    alert(`💥 [${turn === 'red' ? t.redTeam : t.blueTeam}] ${t.selfExplode}`);
                    checkRoundWinOrRespawn();
                    return;
                }

                let opponentTank = turn === 'red' ? blueTank : redTank;
                if (Math.hypot(bullet.x - opponentTank.x, bullet.y - opponentTank.y) < 22) {
                    bullet = null;
                    let targetShields = turn === 'red' ? blueShields : redShields;

                    if (targetShields > 0) {
                        if (turn === 'red') blueShields--; else redShields--;
                        alert(`🛡️ [${turn === 'red' ? t.blueTeam : t.redTeam}] ${t.shieldBlock}`);
                        updateTrialUI();
                        endTurnSequence();
                        return;
                    }

                    let heightBonus = Math.max(0, Math.floor((launchBaseY - bulletMaxHeight) * 0.5));
                    let hitScore = (100 * currentLevel) + heightBonus;

                    if (turn === 'red') { redDestroyed++; redScore += hitScore; }
                    else { blueDestroyed++; blueScore += hitScore; }

                    alert(`💥 [${turn === 'red' ? t.redTeam : t.blueTeam}] ${t.hitEnemy}${hitScore}`);
                    checkRoundWinOrRespawn();
                } 
                else if (bullet.y >= groundY || bullet.y > canvas.height) {
                    if (bullet.y >= groundY) destroyTerrain(bullet.x, 35);
                    bullet = null;
                    endTurnSequence();
                }
            }
        }

        function endTurnSequence() {
            turn = (turn === 'red') ? 'blue' : 'red';
            updateUI();

            if (gameMode === 'hotseat') {
                const t = langData[currentLang];
                let nextTeamName = turn === 'red' ? t.redTeamP1 : t.blueTeamP2;
                document.getElementById('pass-text').innerText = `${nextTeamName}！${t.passText}`;
                document.getElementById('pass-mask').style.display = 'flex';
            }
        }

        function dismissMask() {
            document.getElementById('pass-mask').style.display = 'none';
        }

        function checkRoundWinOrRespawn() {
            if (redDestroyed >= 3 || blueDestroyed >= 3) {
                let winner = redDestroyed >= 3 ? langData[currentLang].blueTeam : langData[currentLang].redTeam;
                const t = langData[currentLang];
                
                let learningAnalytics = `
📊 [${currentLevel}] ${t.analysisTitle}
🏆 ${t.analysisWinner}${winner}
--------------------------------------------------
1. [Trigonometry & Vectors]:
   - Optimal use of angle components and velocity vectors.
2. [Wind Resistance & Shields]:
   - Wind vector: ${(windPower*10).toFixed(1)}. Shields protected against fatal hits.
                `;
                alert(learningAnalytics);

                if (winner === langData[currentLang].redTeam) redMatchWins++; else blueMatchWins++;
                checkMatchWin();
            } else {
                spawnNewTanks();
                endTurnSequence();
            }
        }

        function checkMatchWin() {
            const t = langData[currentLang];
            if (redMatchWins >= 3) {
                showCelebration(`🔴 ${t.redTeam}`, redScore, "#ff5252");
            } else if (blueMatchWins >= 3) {
                showCelebration(`🔵 ${t.blueTeam}`, blueScore, "#448aff");
            } else {
                if (currentLevel < 5) initLevel(currentLevel + 1);
                else {
                    if (redScore >= blueScore) showCelebration(`🔴 ${t.redTeam}`, redScore, "#ff5252");
                    else showCelebration(`🔵 ${t.blueTeam}`, blueScore, "#448aff");
                }
            }
        }

        function showCelebration(winnerName, score, colorHex) {
            const t = langData[currentLang];
            document.getElementById('champion-title').innerText = `${winnerName} ${t.championSuffix}`;
            document.getElementById('champion-title').style.color = colorHex;
            document.getElementById('champion-stats').innerText = t.statsText;
            document.getElementById('celebration-screen').style.display = 'flex';
        }

        function updateTrialUI() {
            let currentTrials = turn === 'red' ? redTrialsLeft : blueTrialsLeft;
            document.getElementById('trialText').innerText = currentTrials;
            let currentShields = turn === 'red' ? redShields : blueShields;
            document.getElementById('shieldText').innerText = currentShields;
        }

        function updateUI() {
            const t = langData[currentLang];
            let teamLabel = turn === 'red' ? t.redTeamP1 : t.blueTeamP2;
            document.getElementById('turnText').innerText = teamLabel;
            document.getElementById('turnText').style.color = turn === 'red' ? "#ff5252" : "#448aff";
            
            let angleText = document.getElementById('angleText');
            let powerText = document.getElementById('powerText');

            if (turn === 'red') {
                angleText.innerText = redTank.angle;
                powerText.innerText = redTank.power;
            } else {
                angleText.innerText = 180 - blueTank.angle;
                powerText.innerText = blueTank.power;
            }
            updateTrialUI();
        }

        function drawTrajectory() {
            if (bullet) return;
            let currentTrials = turn === 'red' ? redTrialsLeft : blueTrialsLeft;
            if (currentTrials <= 0) return;

            let tank = turn === 'red' ? redTank : blueTank;
            let rad = (tank.angle * Math.PI) / 180;
            let speed = tank.power * 0.25;

            let simX = tank.x + Math.cos(rad) * 25;
            let simY = tank.y - Math.sin(rad) * 25;
            let simVx = Math.cos(rad) * speed;
            let simVy = -Math.sin(rad) * speed;

            ctx.strokeStyle = turn === 'red' ? 'rgba(255, 82, 82, 0.7)' : 'rgba(68, 138, 255, 0.7)';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(simX, simY);

            for (let i = 0; i < 70; i++) {
                simX += simVx;
                simY += simVy;
                simVy += 0.22;
                simVx += windPower;

                if (simX <= 0 || simX >= canvas.width) simVx = -simVx * 0.75;

                let groundY = getTerrainY(simX);
                if (simY >= groundY || simY > canvas.height) break;
                ctx.lineTo(simX, simY);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawCoordinateGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '12px sans-serif';

            for (let x = 50; x < canvas.width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                ctx.fillText(x, x - 12, canvas.height - 5);
            }
            for (let y = 50; y < canvas.height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                ctx.fillText(canvas.height - y, 5, y - 3);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawCoordinateGrid();

            ctx.fillStyle = '#27ae60';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            terrainHeights.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();
            ctx.fill();

            drawTrajectory();

            // 紅隊坦克
            ctx.fillStyle = '#ff5252';
            ctx.fillRect(redTank.x - 16, redTank.y - 10, 32, 16);
            ctx.beginPath(); ctx.arc(redTank.x, redTank.y - 10, 11, Math.PI, 0, false); ctx.fill();
            if (redShields > 0) {
                ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(redTank.x, redTank.y - 5, 24, 0, Math.PI * 2); ctx.stroke();
            }
            let redRad = (redTank.angle * Math.PI) / 180;
            ctx.strokeStyle = '#c62828'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(redTank.x, redTank.y - 10);
            ctx.lineTo(redTank.x + Math.cos(redRad) * 22, redTank.y - 10 - Math.sin(redRad) * 22); ctx.stroke();

            // 藍隊坦克
            ctx.fillStyle = '#448aff';
            ctx.fillRect(blueTank.x - 16, blueTank.y - 10, 32, 16);
            ctx.beginPath(); ctx.arc(blueTank.x, blueTank.y - 10, 11, Math.PI, 0, false); ctx.fill();
            if (blueShields > 0) {
                ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(blueTank.x, blueTank.y - 5, 24, 0, Math.PI * 2); ctx.stroke();
            }
            let blueRad = (blueTank.angle * Math.PI) / 180;
            ctx.strokeStyle = '#1565c0'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(blueTank.x, blueTank.y - 10);
            ctx.lineTo(blueTank.x + Math.cos(blueRad) * 22, blueTank.y - 10 - Math.sin(blueRad) * 22); ctx.stroke();

            if (bullet) {
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath(); ctx.arc(bullet.x, bullet.y, 6, 0, Math.PI * 2); ctx.fill();
            }

            const t = langData[currentLang];
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 15px sans-serif';
            ctx.fillText(`🔴 ${t.redTeam}: ${redScore} | ${t.level === 'Level' ? 'Dmg' : '損毀'}: ${redDestroyed}/3`, 20, 25);
            ctx.fillText(`🔵 ${t.blueTeam}: ${blueScore} | ${t.level === 'Level' ? 'Dmg' : '損毀'}: ${blueDestroyed}/3`, canvas.width - 250, 25);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
