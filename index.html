<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學物理坦克大戰 - 國立高雄師範大學 劉世閔博士 總設計</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #lobby, #round-win-screen, #celebration-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 26, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 250;
            gap: 20px;
        }
        #round-win-screen { display: none; z-index: 210; background: rgba(20, 30, 40, 0.96); }
        #celebration-screen { display: none; z-index: 220; background: rgba(15, 15, 15, 0.95); }
        
        h1 { color: #f1c40f; margin-bottom: 5px; text-align: center; font-size: 34px; }
        .designer-tag {
            color: #3498db;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .mode-btn {
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 340px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .mode-btn:hover { background: #219653; }

        #ui {
            margin-bottom: 8px;
            display: flex;
            gap: 10px;
            font-size: 14px;
            font-weight: bold;
            align-items: center;
            background: #2c3e50;
            padding: 8px 14px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            justify-content: center;
        }
        .control-group { display: flex; gap: 4px; align-items: center; }
        button {
            padding: 5px 10px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover { background: #c0392b; }
        
        .game-container { position: relative; }
        canvas {
            border: 4px solid #34495e;
            background: linear-gradient(to bottom, #4a90e2, #e0f6ff);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            max-width: 100%;
            height: auto;
            display: block;
        }

        #math-panel {
            margin-top: 8px;
            background: #34495e;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            color: #f1c40f;
            text-align: center;
            max-width: 840px;
            font-weight: bold;
        }

        .trophy-card {
            background: #2c3e50;
            border: 3px solid #f1c40f;
            padding: 35px 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.5);
            max-width: 650px;
        }
    </style>
</head>
<body>

    <!-- 🏠 遊戲大廳 -->
    <div id="lobby">
        <h1>🎯 數學物理坦克大戰</h1>
        <div class="designer-tag">國立高雄師範大學 劉世閔博士 總設計</div>
        <p style="color: #ddd; margin-bottom: 15px; font-size: 18px;">一人或雙人皆可玩，點擊下方按鈕開始對決：</p>
        <button class="mode-btn" onclick="startGame()">🚀 開始對戰</button>
    </div>

    <!-- 📢 每局結束宣判畫面 -->
    <div id="round-win-screen">
        <div class="trophy-card">
            <div style="font-size: 60px; margin-bottom: 10px;">🎯</div>
            <h1 id="round-winner-title" style="color: #f1c40f; font-size: 32px;">紅隊 贏得第 1 局勝利！</h1>
            <div class="designer-tag" style="margin: 10px 0; font-size: 15px;">國立高雄師範大學 劉世閔博士 總設計</div>
            <p id="round-winner-stats" style="color: #ecf0f1; font-size: 16px; margin: 15px 0;">地形將完全變換，考驗全新物理計算！</p>
            <button class="mode-btn" onclick="proceedToNextLevel()" style="margin-top: 10px; width: 260px;">進入下一局（變換地形）➔</button>
        </div>
    </div>

    <!-- 🏆 總冠軍結算畫面 -->
    <div id="celebration-screen">
        <div class="trophy-card">
            <div style="font-size: 70px; margin-bottom: 10px;">🏆</div>
            <h1 id="champion-title" style="color: #ff5252; font-size: 36px;">紅隊 榮獲總冠軍！</h1>
            <div class="designer-tag" style="margin: 10px 0; font-size: 16px;">國立高雄師範大學 劉世閔博士 總設計</div>
            <p style="color: #ecf0f1; font-size: 17px; margin: 20px 0;">經過五局激戰，展現了卓越的物理計算能力！</p>
            <button class="mode-btn" onclick="returnToLobby()" style="margin-top: 15px; width: 220px;">🔄 再次挑戰</button>
        </div>
    </div>

    <!-- 🎮 遊戲操控介面 -->
    <div id="ui">
        <div>局數: <span id="levelText" style="color: #f1c40f; font-weight: bold;">1</span>/5</div>
        <div>回合: <span id="turnText" style="color: #ff5252; font-weight: bold;">紅隊</span></div>
        <div>風速: <span id="windText" style="color: #00e676;">0.0</span></div>
        <div>試瞄次數: <span id="trialText" style="color: #00e676; font-weight: bold;">4</span></div>
        <div class="control-group">
            <span>移動:</span>
            <button onclick="moveTank(-15)" style="background: #2980b9;" title="向後移動">◀</button>
            <button onclick="moveTank(15)" style="background: #2980b9;" title="向前移動">▶</button>
        </div>
        <div class="control-group">
            <span>仰角: <span id="angleText">45</span>°</span>
            <button onclick="adjustAngle(-5)">➖</button>
            <button onclick="adjustAngle(5)">➕</button>
        </div>
        <div class="control-group">
            <span>力度: <span id="powerText">50</span></span>
            <button onclick="adjustPower(-5)">➖</button>
            <button onclick="adjustPower(5)">➕</button>
        </div>
        <button onclick="fireCannon()" id="fireBtn" style="background: #27ae60;">🔥 發射</button>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="420"></canvas>
    </div>

    <!-- 💡 動態教育提示面板（試瞄歸零時顯示前一次數據供學生修正） -->
    <div id="math-panel">
        💡 寓教於樂提示：試瞄線歸零後將進入科學盲狙期，下方將提供前一次設定值以供學生修正數據！
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameActive = false;

        let currentLevel = 1, turn = 'red', terrainHeights = [], windPower = 0.0; 
        let redScore = 0, blueScore = 0;
        let redDestroyed = 0, blueDestroyed = 0;
        let redTank = { x: 120, y: 320, angle: 45, power: 50 };
        let blueTank = { x: 680, y: 320, angle: 45, power: 50 };
        let redTrialsLeft = 4, blueTrialsLeft = 4;
        
        // 🎯 記錄各隊前一次的發射設定（供無試瞄時的數據修正參考）
        let redLastShot = { angle: 45, power: 50, fired: false };
        let blueLastShot = { angle: 45, power: 50, fired: false };

        let bullet = null;
        let explosions = [];

        window.startGame = function() {
            bullet = null;
            explosions = [];
            currentLevel = 1;
            redScore = 0;
            blueScore = 0;
            redDestroyed = 0;
            blueDestroyed = 0;
            gameActive = true;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('round-win-screen').style.display = 'none';
            document.getElementById('celebration-screen').style.display = 'none';
            initLevel();
        };

        window.returnToLobby = function() {
            bullet = null;
            explosions = [];
            gameActive = false;
            document.getElementById('round-win-screen').style.display = 'none';
            document.getElementById('celebration-screen').style.display = 'none';
            document.getElementById('lobby').style.display = 'flex';
        };

        function generateTerrain() {
            terrainHeights = [];
            windPower = Number(((Math.random() - 0.5) * (0.5 + currentLevel * 0.1)).toFixed(1));
            document.getElementById('windText').innerText = windPower > 0 ? `+${windPower}` : windPower;
            for (let x = 0; x <= canvas.width; x += 10) {
                let y = 300 + Math.sin(x * 0.015) * 35 + Math.cos(x * 0.02) * 20;
                terrainHeights.push({ x: x, y: Math.min(370, Math.max(180, y)) });
            }
        }

        function getTerrainY(x) {
            if (x < 0) x = 0;
            if (x > canvas.width) x = canvas.width;
            for (let i = 0; i < terrainHeights.length - 1; i++) {
                if (x >= terrainHeights[i].x && x <= terrainHeights[i+1].x) {
                    let t = (x - terrainHeights[i].x) / (terrainHeights[i+1].x - terrainHeights[i].x);
                    return terrainHeights[i].y * (1 - t) + terrainHeights[i+1].y * t;
                }
            }
            return 320;
        }

        function spawnTanks() {
            bullet = null;
            explosions = [];
            redTank.x = 120; blueTank.x = 680;
            redTank.y = getTerrainY(redTank.x) - 15;
            blueTank.y = getTerrainY(blueTank.x) - 15;
            redTank.angle = 45; blueTank.angle = 45;
            redTank.power = 50; blueTank.power = 50;
        }

        function initLevel() {
            bullet = null;
            explosions = [];
            redDestroyed = 0; 
            blueDestroyed = 0;
            let trialsConfig = Math.max(0, 5 - currentLevel);
            redTrialsLeft = trialsConfig;
            blueTrialsLeft = trialsConfig;
            redLastShot = { angle: 45, power: 50, fired: false };
            blueLastShot = { angle: 45, power: 50, fired: false };

            // 🎯 確保輪流先攻：奇數局（第1、3、5局）紅方先攻，偶數局（第2、4局）藍方先攻
            turn = (currentLevel % 2 === 1) ? 'red' : 'blue';

            generateTerrain();
            spawnTanks();
            updateUI();
        }

        window.proceedToNextLevel = function() {
            document.getElementById('round-win-screen').style.display = 'none';
            currentLevel++;
            initLevel();
            gameActive = true;
        };

        window.moveTank = function(amount) {
            if (!gameActive || bullet) return;
            let tank = (turn === 'red') ? redTank : blueTank;
            
            let minX = (turn === 'red') ? 60 : 450;
            let maxX = (turn === 'red') ? 350 : 740;

            let nextX = Math.max(minX, Math.min(maxX, tank.x + amount));
            tank.x = nextX;
            tank.y = getTerrainY(nextX) - 15;
        };

        window.adjustAngle = function(amount) {
            if (!gameActive || bullet) return;
            let tank = (turn === 'red') ? redTank : blueTank;
            tank.angle = Math.max(0, Math.min(90, tank.angle + amount));
            document.getElementById('angleText').innerText = tank.angle;
        };

        window.adjustPower = function(amount) {
            if (!gameActive || bullet) return;
            let tank = (turn === 'red') ? redTank : blueTank;
            tank.power = Math.max(10, Math.min(100, tank.power + amount));
            document.getElementById('powerText').innerText = tank.power;
        };

        window.fireCannon = function() {
            if (!gameActive || bullet) return;

            let tank = (turn === 'red') ? redTank : blueTank;

            // 🎯 記錄該隊伍的發射設定（供無試瞄時參考修正）
            if (turn === 'red') {
                redLastShot = { angle: tank.angle, power: tank.power, fired: true };
                if (redTrialsLeft > 0) redTrialsLeft--;
            } else {
                blueLastShot = { angle: tank.angle, power: tank.power, fired: true };
                if (blueTrialsLeft > 0) blueTrialsLeft--;
            }
            updateTrialUI();

            let rad = (tank.angle * Math.PI) / 180;
            let speed = tank.power * 0.25;
            let dir = (turn === 'red') ? 1 : -1;

            // ⚖️ 紅藍雙方物理發射引擎完全對稱標準化
            bullet = {
                x: tank.x + dir * Math.cos(rad) * 28,
                y: (tank.y - 10) - Math.sin(rad) * 28,
                vx: dir * Math.cos(rad) * speed,
                vy: -Math.sin(rad) * speed,
                color: (turn === 'red') ? '#ff5252' : '#448aff',
                age: 0
            };
        };

        function triggerExplosion(x, y, color) {
            for (let i = 0; i < 35; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 6 + 2;
                explosions.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 5 + 2,
                    color: color,
                    alpha: 1.0,
                    decay: 0.03
                });
            }
        }

        function update() {
            if (!gameActive) return;

            for (let i = explosions.length - 1; i >= 0; i--) {
                let p = explosions[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) explosions.splice(i, 1);
            }

            if (bullet) {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                bullet.vy += 0.22;
                bullet.vx += windPower;
                bullet.age++;

                let groundY = getTerrainY(bullet.x);
                let opponentTank = (turn === 'red') ? blueTank : redTank;
                let activeTank = (turn === 'red') ? redTank : blueTank;

                // 牆壁撞球反彈
                if (bullet.x <= 0) {
                    bullet.x = 0;
                    bullet.vx = -bullet.vx * 0.75;
                } else if (bullet.x >= canvas.width) {
                    bullet.x = canvas.width;
                    bullet.vx = -bullet.vx * 0.75;
                }

                if (bullet.age > 12 && Math.abs(bullet.x - opponentTank.x) < 18 && Math.abs(bullet.y - opponentTank.y) < 18) {
                    triggerExplosion(opponentTank.x, opponentTank.y, turn === 'red' ? '#ff5252' : '#448aff');
                    bullet = null;
                    let hitScore = Math.floor(150 * currentLevel);
                    if (turn === 'red') { redScore += hitScore; redDestroyed++; }
                    else { blueScore += hitScore; blueDestroyed++; }
                    checkRoundEnd();
                    return;
                }

                if (bullet.age > 12 && Math.abs(bullet.x - activeTank.x) < 18 && Math.abs(bullet.y - activeTank.y) < 18) {
                    triggerExplosion(activeTank.x, activeTank.y, '#f1c40f');
                    bullet = null;
                    if (turn === 'red') blueDestroyed++; else redDestroyed++;
                    checkRoundEnd();
                    return;
                }

                if (bullet.y >= groundY) {
                    triggerExplosion(bullet.x, groundY, '#e67e22');
                    bullet = null;
                    turn = (turn === 'red') ? 'blue' : 'red';
                    updateUI();
                } else if (bullet.y > canvas.height) {
                    bullet = null;
                    turn = (turn === 'red') ? 'blue' : 'red';
                    updateUI();
                }
            }
        }

        function checkRoundEnd() {
            bullet = null;
            if (redDestroyed >= 3 || blueDestroyed >= 3) {
                gameActive = false;
                let winnerText = (redDestroyed >= 3) ? "🔴 紅隊" : "🔵 藍隊";
                if (currentLevel >= 5) {
                    document.getElementById('champion-title').innerText = `${winnerText} 榮獲總冠軍！`;
                    document.getElementById('celebration-screen').style.display = 'flex';
                } else {
                    document.getElementById('round-winner-title').innerText = `${winnerText} 贏得第 ${currentLevel} 局勝利！`;
                    document.getElementById('round-winner-title').style.color = (redDestroyed >= 3) ? '#ff5252' : '#448aff';
                    document.getElementById('round-winner-stats').innerText = `紅分: ${redScore} | 藍分: ${blueScore}，即將變換全新地形進入下一局！`;
                    document.getElementById('round-win-screen').style.display = 'flex';
                }
            } else {
                spawnTanks();
                turn = (turn === 'red') ? 'blue' : 'red';
                updateUI();
            }
        }

        function updateTrialUI() {
            let currentTrials = (turn === 'red') ? redTrialsLeft : blueTrialsLeft;
            document.getElementById('trialText').innerText = currentTrials;
            
            // 🎯 科學探索盲狙提示：試瞄線歸零時，顯示前一次的數據供學生參考修正
            let lastShot = (turn === 'red') ? redLastShot : blueLastShot;
            let mathPanel = document.getElementById('math-panel');
            let teamName = (turn === 'red') ? '紅隊' : '藍隊';

            if (currentTrials <= 0 && lastShot.fired) {
                mathPanel.innerHTML = `⚠️ 【${teamName} 科學盲狙期】試瞄線已關閉！前一次發射數據：仰角 <span style="color:#00ff66;">${lastShot.angle}°</span>、力度 <span style="color:#00ff66;">${lastShot.power}</span>，請依風向與地形自主修正！`;
            } else {
                mathPanel.innerHTML = `💡 寓教於樂提示：結合角度、力度、風速與地形起伏，善用試瞄線與戰車移動來精準打擊！`;
            }
        }

        function updateUI() {
            let turnEl = document.getElementById('turnText');
            turnEl.innerText = (turn === 'red') ? '紅隊' : '藍隊';
            turnEl.style.color = (turn === 'red') ? '#ff5252' : '#448aff';

            let currentTank = (turn === 'red') ? redTank : blueTank;
            document.getElementById('angleText').innerText = currentTank.angle;
            document.getElementById('powerText').innerText = currentTank.power;
            document.getElementById('levelText').innerText = currentLevel;
            updateTrialUI();
        }

        function drawTrajectoryPreview() {
            if (bullet) return;
            let currentTrials = (turn === 'red') ? redTrialsLeft : blueTrialsLeft;
            if (currentTrials <= 0) return;

            let tank = (turn === 'red') ? redTank : blueTank;
            let rad = (tank.angle * Math.PI) / 180;
            let speed = tank.power * 0.25;
            let dir = (turn === 'red') ? 1 : -1;

            let simX = tank.x + dir * Math.cos(rad) * 28;
            let simY = (tank.y - 10) - Math.sin(rad) * 28;
            let simVx = dir * Math.cos(rad) * speed;
            let simVy = -Math.sin(rad) * speed;

            ctx.strokeStyle = (turn === 'red') ? 'rgba(255, 82, 82, 0.7)' : 'rgba(68, 138, 255, 0.7)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(simX, simY);

            for (let i = 0; i < 60; i++) {
                simX += simVx;
                simY += simVy;
                simVy += 0.22;
                simVx += windPower;

                if (simX <= 0) { simX = 0; simVx = -simVx * 0.75; }
                else if (simX >= canvas.width) { simX = canvas.width; simVx = -simVx * 0.75; }

                let groundY = getTerrainY(simX);
                if (simY >= groundY || simY > canvas.height) break;
                ctx.lineTo(simX, simY);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!gameActive) return;

            ctx.fillStyle = '#27ae60';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            terrainHeights.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();
            ctx.fill();

            drawTrajectoryPreview();

            // 紅隊坦克
            ctx.fillStyle = '#ff5252';
            ctx.fillRect(redTank.x - 16, redTank.y - 10, 32, 16);
            ctx.beginPath(); ctx.arc(redTank.x, redTank.y - 10, 11, Math.PI, 0, false); ctx.fill();
            let redRad = (redTank.angle * Math.PI) / 180;
            ctx.strokeStyle = '#c62828'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(redTank.x, redTank.y - 10);
            ctx.lineTo(redTank.x + Math.cos(redRad) * 22, redTank.y - 10 - Math.sin(redRad) * 22); ctx.stroke();

            // 藍隊坦克
            ctx.fillStyle = '#448aff';
            ctx.fillRect(blueTank.x - 16, blueTank.y - 10, 32, 16);
            ctx.beginPath(); ctx.arc(blueTank.x, blueTank.y - 10, 11, Math.PI, 0, false); ctx.fill();
            let blueRad = (blueTank.angle * Math.PI) / 180;
            ctx.strokeStyle = '#1565c0'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(blueTank.x, blueTank.y - 10);
            ctx.lineTo(blueTank.x - Math.cos(blueRad) * 22, blueTank.y - 10 - Math.sin(blueRad) * 22); ctx.stroke();

            // 砲彈
            if (bullet) {
                ctx.fillStyle = bullet.color || '#f1c40f';
                ctx.beginPath(); ctx.arc(bullet.x, bullet.y, 6, 0, Math.PI * 2); ctx.fill();
            }

            // 爆炸粒子
            explosions.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 15px sans-serif';
            ctx.fillText(`🔴 紅隊積分: ${redScore} | 擊毀: ${redDestroyed}/3`, 20, 25);
            ctx.fillText(`🔵 藍隊積分: ${blueScore} | 擊毀: ${blueDestroyed}/3`, canvas.width - 250, 25);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
