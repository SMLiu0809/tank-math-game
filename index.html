<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學物理坦克大戰 - 大字體舒適版</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        /* 模式選擇大廳畫面 */
        #lobby, #celebration-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 26, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 25px;
        }
        #celebration-screen { display: none; z-index: 20; background: rgba(15, 15, 15, 0.95); }
        
        h1 { color: #f1c40f; margin-bottom: 5px; text-align: center; font-size: 36px; }
        .designer-tag {
            color: #3498db;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .mode-btn {
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 340px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .mode-btn:hover { background: #219653; }
        
        /* 放大頂部 UI 介面，保護眼睛 */
        #ui {
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
            font-size: 16px;
            font-weight: bold;
            align-items: center;
            background: #2c3e50;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            justify-content: center;
        }
        .control-group { display: flex; gap: 8px; align-items: center; }
        button {
            padding: 8px 14px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover { background: #c0392b; }
        canvas {
            border: 4px solid #34495e;
            background: linear-gradient(to bottom, #4a90e2, #e0f6ff);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            max-width: 100%;
            height: auto;
        }
        #math-panel {
            margin-top: 10px;
            background: #34495e;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            color: #f1c40f;
            text-align: center;
            max-width: 820px;
            font-weight: bold;
        }

        /* 換手過場遮罩 (二人一機專用) */
        #pass-mask {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            font-size: 28px;
            color: #f1c40f;
            gap: 20px;
        }

        .trophy-card {
            background: #2c3e50;
            border: 3px solid #f1c40f;
            padding: 40px 60px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.5);
            max-width: 650px;
        }
    </style>
</head>
<body>

    <!-- 模式選擇大廳 -->
    <div id="lobby">
        <h1>🎯 數學物理坦克大戰</h1>
        <div class="designer-tag">國立高雄師範大學 劉世閔博士 總設計</div>
        <p style="color: #ddd; margin-bottom: 15px; font-size: 18px;">請選擇您的遊玩模式：</p>
        <button class="mode-btn" onclick="startMode('self')">👤 1. 單人左右互搏 (自我訓練)</button>
        <button class="mode-btn" onclick="startMode('hotseat')">👥 2. 二人一機對戰 (同機過場)</button>
    </div>

    <!-- 🏆 總冠軍頒獎典禮畫面 -->
    <div id="celebration-screen">
        <div class="trophy-card">
            <div style="font-size: 70px; margin-bottom: 10px;">🏆</div>
            <h1 id="champion-title" style="color: #ff5252; font-size: 38px;">紅隊 榮獲總冠軍！</h1>
            <div class="designer-tag" style="margin: 10px 0; font-size: 16px;">國立高雄師範大學 劉世閔博士 總設計</div>
            <p style="color: #ecf0f1; font-size: 18px; margin: 20px 0;" id="champion-stats">經過五戰三勝激戰，展現了卓越的數學與物理計算能力！</p>
            <button class="mode-btn" onclick="returnToLobby()" style="margin-top: 20px; width: 220px;">🔄 再次挑戰</button>
        </div>
    </div>

    <!-- 二人一機過場遮罩 -->
    <div id="pass-mask">
        <div id="pass-text">請把電腦交給下一位玩家！</div>
        <button class="mode-btn" onclick="dismissMask()" style="width: 220px;">準備好了！</button>
    </div>

    <div id="ui">
        <div>局數: <span id="levelText" style="color: #f1c40f; font-weight: bold;">1</span>/5</div>
        <div>回合: <span id="turnText" style="color: #ff5252; font-weight: bold;">紅隊</span></div>
        <div>風速: <span id="windText" style="color: #00e676;">0</span></div>
        <div>試瞄: <span id="trialText" style="color: #00e676; font-weight: bold;">4</span></div>
        <div>防護罩: <span id="shieldText" style="color: #00e5ff; font-weight: bold;">0</span></div>
        <div class="control-group">
            <span>仰角: <span id="angleText">45</span>°</span>
            <button onclick="adjustAngle(-5)">➖</button>
            <button onclick="adjustAngle(5)">➕</button>
        </div>
        <div class="control-group">
            <span>力度: <span id="powerText">50</span></span>
            <button onclick="adjustPower(-5)">➖</button>
            <button onclick="adjustPower(5)">➕</button>
        </div>
        <button onclick="fireCannon()" id="fireBtn" style="background: #27ae60;">🔥 發射</button>
    </div>

    <canvas id="gameCanvas" width="800" height="420"></canvas>

    <div id="math-panel">
        💡 戰略提示：第四關起雙方配備防護罩（第4關1次，第5關2次），可自動抵擋致命攻擊！
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameMode = ''; 

        function startMode(mode) {
            gameMode = mode;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('celebration-screen').style.display = 'none';
            initGameLoop();
        }

        function returnToLobby() {
            document.getElementById('celebration-screen').style.display = 'none';
            document.getElementById('lobby').style.display = 'flex';
        }

        let currentLevel = 1; 
        let turn = 'red'; 
        let terrainHeights = [];
        let windPower = 0; 

        let redMatchWins = 0, blueMatchWins = 0;
        let redScore = 0, blueScore = 0;
        let redDestroyed = 0, blueDestroyed = 0;

        let redTank = { x: 100, y: 320, angle: 45, power: 50 };
        let blueTank = { x: 700, y: 320, angle: 135, power: 50 };

        let redTrialsLeft = 4;
        let blueTrialsLeft = 4;
        let redShields = 0, blueShields = 0;

        let bulletMaxHeight = 0, launchBaseY = 320;
        let bullet = null;

        function fnUpdateWindAndTerrain() {
            windPower = (Math.random() - 0.5) * (currentLevel * 0.18);
            let windDesc = windPower === 0 ? "0.0" : (windPower > 0 ? `+${(windPower*10).toFixed(1)}` : `${(windPower*10).toFixed(1)}`);
            document.getElementById('windText').innerText = windDesc;
        }

        function generateTerrain() {
            terrainHeights = [];
            for (let x = 0; x <= canvas.width; x += 10) {
                let y = 320 + Math.sin(x * 0.015) * 45 + Math.cos(x * 0.008) * 30;
                terrainHeights.push({ x: x, y: Math.min(380, Math.max(150, y)) });
            }
        }

        function getTerrainY(x) {
            for (let i = 0; i < terrainHeights.length - 1; i++) {
                if (x >= terrainHeights[i].x && x <= terrainHeights[i+1].x) {
                    let t = (x - terrainHeights[i].x) / (terrainHeights[i+1].x - terrainHeights[i].x);
                    return terrainHeights[i].y * (1 - t) + terrainHeights[i+1].y * t;
                }
            }
            return 320;
        }

        function destroyTerrain(hitX, radius) {
            terrainHeights.forEach(p => {
                let dist = Math.abs(p.x - hitX);
                if (dist < radius) {
                    let depth = Math.sqrt(radius * radius - dist * dist) * 0.6;
                    p.y = Math.min(400, p.y + depth);
                }
            });
        }

        function initLevel(level) {
            currentLevel = level;
            redDestroyed = 0; blueDestroyed = 0;
            let initialTrials = Math.max(0, 5 - level);
            redTrialsLeft = initialTrials;
            blueTrialsLeft = initialTrials;

            redShields = level >= 5 ? 2 : (level >= 4 ? 1 : 0);
            blueShields = level >= 5 ? 2 : (level >= 4 ? 1 : 0);

            document.getElementById('levelText').innerText = currentLevel;
            updateTrialUI();
            generateTerrain();
            spawnNewTanks();
        }

        function spawnNewTanks() {
            redTank.x = 60 + Math.random() * 180;
            blueTank.x = 560 + Math.random() * 180;
            redTank.y = getTerrainY(redTank.x) - 15;
            blueTank.y = getTerrainY(blueTank.x) - 15;
            redTank.angle = 45; blueTank.angle = 135;
            fnUpdateWindAndTerrain();
            updateUI();
        }

        function initGameLoop() {
            redMatchWins = 0; blueMatchWins = 0; redScore = 0; blueScore = 0;
            initLevel(1);
            loop();
        }

        function adjustAngle(amount) {
            if (turn === 'red') {
                redTank.angle = Math.max(0, Math.min(90, redTank.angle + amount));
                document.getElementById('angleText').innerText = redTank.angle;
            } else {
                blueTank.angle = Math.max(90, Math.min(180, blueTank.angle + amount));
                document.getElementById('angleText').innerText = 180 - blueTank.angle;
            }
        }

        function adjustPower(amount) {
            if (turn === 'red') {
                redTank.power = Math.max(10, Math.min(100, redTank.power + amount));
                document.getElementById('powerText').innerText = redTank.power;
            } else {
                blueTank.power = Math.max(10, Math.min(100, blueTank.power + amount));
                document.getElementById('powerText').innerText = blueTank.power;
            }
        }

        function fireCannon() {
            if (bullet) return;

            if (turn === 'red' && redTrialsLeft > 0) redTrialsLeft--;
            else if (turn === 'blue' && blueTrialsLeft > 0) blueTrialsLeft--;
            updateTrialUI();

            let tank = turn === 'red' ? redTank : blueTank;
            let rad = (tank.angle * Math.PI) / 180;
            let speed = tank.power * 0.25;
            launchBaseY = tank.y;
            bulletMaxHeight = tank.y;

            bullet = {
                x: tank.x + Math.cos(rad) * 25,
                y: tank.y - Math.sin(rad) * 25,
                vx: Math.cos(rad) * speed,
                vy: -Math.sin(rad) * speed,
                age: 0
            };
        }

        function update() {
            if (bullet) {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                bullet.vy += 0.22; 
                bullet.vx += windPower; 
                bullet.age++;

                if (bullet.y < bulletMaxHeight) bulletMaxHeight = bullet.y;

                if (bullet.x <= 0) { bullet.x = 0; bullet.vx = -bullet.vx * 0.75; }
                else if (bullet.x >= canvas.width) { bullet.x = canvas.width; bullet.vx = -bullet.vx * 0.75; }

                let groundY = getTerrainY(bullet.x);
                let activeTank = turn === 'red' ? redTank : blueTank;
                
                if (bullet.age > 12 && Math.hypot(bullet.x - activeTank.x, bullet.y - activeTank.y) < 22) {
                    bullet = null;
                    let currentShields = turn === 'red' ? redShields : blueShields;
                    if (currentShields > 0) {
                        if (turn === 'red') redShields--; else blueShields--;
                        alert(`🛡️ ${turn === 'red' ? '紅隊' : '藍隊'} 防護罩成功擋下自己的失誤自炸！`);
                        updateTrialUI();
                        endTurnSequence();
                        return;
                    }
                    if (turn === 'red') redDestroyed++; else blueDestroyed++;
                    alert(`💥 ${turn === 'red' ? '紅隊' : '藍隊'} 計算錯誤，發生自炸！`);
                    checkRoundWinOrRespawn();
                    return;
                }

                let opponentTank = turn === 'red' ? blueTank : redTank;
                if (Math.hypot(bullet.x - opponentTank.x, bullet.y - opponentTank.y) < 22) {
                    bullet = null;
                    let targetShields = turn === 'red' ? blueShields : redShields;

                    if (targetShields > 0) {
                        if (turn === 'red') blueShields--; else redShields--;
                        alert(`🛡️ ${turn === 'red' ? '藍隊' : '紅隊'} 的防護罩發揮效用，成功抵擋了攻擊！`);
                        updateTrialUI();
                        endTurnSequence();
                        return;
                    }

                    let heightBonus = Math.max(0, Math.floor((launchBaseY - bulletMaxHeight) * 0.5));
                    let hitScore = (100 * currentLevel) + heightBonus;

                    if (turn === 'red') { redDestroyed++; redScore += hitScore; }
                    else { blueDestroyed++; blueScore += hitScore; }

                    alert(`💥 ${turn === 'red' ? '紅隊' : '藍隊'} 命中敵方！總分: ${hitScore}`);
                    checkRoundWinOrRespawn();
                } 
                else if (bullet.y >= groundY || bullet.y > canvas.height) {
                    if (bullet.y >= groundY) destroyTerrain(bullet.x, 35);
                    bullet = null;
                    endTurnSequence();
                }
            }
        }

        function endTurnSequence() {
            turn = (turn === 'red') ? 'blue' : 'red';
            updateUI();

            if (gameMode === 'hotseat') {
                let nextTeamName = turn === 'red' ? "紅隊 (玩家1)" : "藍隊 (玩家2)";
                document.getElementById('pass-text').innerText = `輪到 ${nextTeamName} 了！請把電腦交給對方。`;
                document.getElementById('pass-mask').style.display = 'flex';
            }
        }

        function dismissMask() {
            document.getElementById('pass-mask').style.display = 'none';
        }

        function checkRoundWinOrRespawn() {
            if (redDestroyed >= 3 || blueDestroyed >= 3) {
                let winner = redDestroyed >= 3 ? "藍隊" : "紅隊";
                
                let learningAnalytics = `
📊 【第 ${currentLevel} 局物理與數學學習解析】
🏆 獲勝方：${winner}
--------------------------------------------------
1. 【角度與三角函數分析】：
   - 獲勝方成功利用了初速向量與仰角的三角函數分量，精準計算出水平射程與頂點高度。
2. 【向量風速與防護罩戰略】：
   - 本局風速向量值為：${windPower > 0 ? "+" + (windPower*10).toFixed(1) : (windPower*10).toFixed(1)}。
3. 【目前賽局比數】：
   - 紅勝 ${winner === '紅隊' ? redMatchWins + 1 : redMatchWins} | 藍勝 ${winner === '藍隊' ? blueMatchWins + 1 : blueMatchWins} (五戰三勝制)
                `;
                alert(learningAnalytics);

                if (winner === "紅隊") redMatchWins++; else blueMatchWins++;
                checkMatchWin();
            } else {
                spawnNewTanks();
                endTurnSequence();
            }
        }

        function checkMatchWin() {
            if (redMatchWins >= 3) {
                showCelebration("🔴 紅隊", redScore, "#ff5252");
            } else if (blueMatchWins >= 3) {
                showCelebration("🔵 藍隊", blueScore, "#448aff");
            } else {
                if (currentLevel < 5) initLevel(currentLevel + 1);
                else {
                    if (redScore >= blueScore) showCelebration("🔴 紅隊 (最高總分)", redScore, "#ff5252");
                    else showCelebration("🔵 藍隊 (最高總分)", blueScore, "#448aff");
                }
            }
        }

        function showCelebration(winnerName, score, colorHex) {
            document.getElementById('champion-title').innerText = `${winnerName} 榮獲總冠軍！`;
            document.getElementById('champion-title').style.color = colorHex;
            document.getElementById('champion-stats').innerText = `經過激烈的五戰三勝對決，總得分高達 ${score} 分！成功掌握了角度、力度與風向向量的奧祕！`;
            document.getElementById('celebration-screen').style.display = 'flex';
        }

        function updateTrialUI() {
            let currentTrials = turn === 'red' ? redTrialsLeft : blueTrialsLeft;
            document.getElementById('trialText').innerText = currentTrials;
            let currentShields = turn === 'red' ? redShields : blueShields;
            document.getElementById('shieldText').innerText = currentShields;
        }

        function updateUI() {
            let teamLabel = turn === 'red' ? "紅隊 (玩家1)" : "藍隊 (玩家2)";
            document.getElementById('turnText').innerText = teamLabel;
            document.getElementById('turnText').style.color = turn === 'red' ? "#ff5252" : "#448aff";
            
            let angleText = document.getElementById('angleText');
            let powerText = document.getElementById('powerText');

            if (turn === 'red') {
                angleText.innerText = redTank.angle;
                powerText.innerText = redTank.power;
            } else {
                angleText.innerText = 180 - blueTank.angle;
                powerText.innerText = blueTank.power;
            }
            updateTrialUI();
        }

        function drawTrajectory() {
            if (bullet) return;
            let currentTrials = turn === 'red' ? redTrialsLeft : blueTrialsLeft;
            if (currentTrials <= 0) return;

            let tank = turn === 'red' ? redTank : blueTank;
            let rad = (tank.angle * Math.PI) / 180;
            let speed = tank.power * 0.25;

            let simX = tank.x + Math.cos(rad) * 25;
            let simY = tank.y - Math.sin(rad) * 25;
            let simVx = Math.cos(rad) * speed;
            let simVy = -Math.sin(rad) * speed;

            ctx.strokeStyle = turn === 'red' ? 'rgba(255, 82, 82, 0.7)' : 'rgba(68, 138, 255, 0.7)';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(simX, simY);

            for (let i = 0; i < 70; i++) {
                simX += simVx;
                simY += simVy;
                simVy += 0.22;
                simVx += windPower;

                if (simX <= 0 || simX >= canvas.width) simVx = -simVx * 0.75;

                let groundY = getTerrainY(simX);
                if (simY >= groundY || simY > canvas.height) break;
                ctx.lineTo(simX, simY);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawCoordinateGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '12px sans-serif'; // 刻度字體放大

            for (let x = 50; x < canvas.width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                ctx.fillText(x, x - 12, canvas.height - 5);
            }
            for (let y = 50; y < canvas.height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                ctx.fillText(canvas.height - y, 5, y - 3);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawCoordinateGrid();

            ctx.fillStyle = '#27ae60';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            terrainHeights.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();
            ctx.fill();

            drawTrajectory();

            // 紅隊坦克與防護罩
            ctx.fillStyle = '#ff5252';
            ctx.fillRect(redTank.x - 16, redTank.y - 10, 32, 16);
            ctx.beginPath(); ctx.arc(redTank.x, redTank.y - 10, 11, Math.PI, 0, false); ctx.fill();
            if (redShields > 0) {
                ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(redTank.x, redTank.y - 5, 24, 0, Math.PI * 2); ctx.stroke();
            }
            let redRad = (redTank.angle * Math.PI) / 180;
            ctx.strokeStyle = '#c62828'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(redTank.x, redTank.y - 10);
            ctx.lineTo(redTank.x + Math.cos(redRad) * 22, redTank.y - 10 - Math.sin(redRad) * 22); ctx.stroke();

            // 藍隊坦克與防護罩
            ctx.fillStyle = '#448aff';
            ctx.fillRect(blueTank.x - 16, blueTank.y - 10, 32, 16);
            ctx.beginPath(); ctx.arc(blueTank.x, blueTank.y - 10, 11, Math.PI, 0, false); ctx.fill();
            if (blueShields > 0) {
                ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(blueTank.x, blueTank.y - 5, 24, 0, Math.PI * 2); ctx.stroke();
            }
            let blueRad = (blueTank.angle * Math.PI) / 180;
            ctx.strokeStyle = '#1565c0'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(blueTank.x, blueTank.y - 10);
            ctx.lineTo(blueTank.x + Math.cos(blueRad) * 22, blueTank.y - 10 - Math.sin(blueRad) * 22); ctx.stroke();

            if (bullet) {
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath(); ctx.arc(bullet.x, bullet.y, 6, 0, Math.PI * 2); ctx.fill();
            }

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 15px sans-serif'; // 畫布上的分數文字放大
            ctx.fillText(`🔴 紅總分: ${redScore} | 損毀: ${redDestroyed}/3`, 20, 25);
            ctx.fillText(`🔵 藍總分: ${blueScore} | 損毀: ${blueDestroyed}/3`, canvas.width - 250, 25);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
